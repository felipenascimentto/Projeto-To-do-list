<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js" defer></script>
</head>

<body>

    <main class="tela-inicial">

        <h1 class="titulo-principal"> Vamos organizar seu dia!</h1>

        <div class="primeira-linha">

            <div class="duas-opcao">
            <a class="opcao vida-pessoal" href="vp-escolha.html" aria-label="Escolher"> Vida pessoal </a>

            </div>

            <a class="opcao estudante" href="estudante.html">Estudante</a>

        </div>

        <div class="segunda-linha">

            <svg id="bonequinho" class="bonequinho" width="260" height="390" viewBox="0 0 200 350" role="button" tabindex="0" aria-label="Tocar na mão do bonequinho">
                <circle cx="100" cy="100" r="40" fill="white" stroke="black" stroke-width="4" />

                <line x1="100" y1="140" x2="100" y2="230" stroke="black" stroke-width="4" />

                <line x1="100" y1="160" x2="65" y2="195" stroke="black" stroke-width="4" />
                <g id="mao-acenando" class="mao-acenando">
                    <line x1="100" y1="160" x2="140" y2="125" stroke="black" stroke-width="4" />

                    <circle cx="145" cy="120" r="8" fill="white" stroke="black" stroke-width="4" />

                    <line x1="148" y1="115" x2="150" y2="104" stroke="black" stroke-width="4" />
                    <line x1="153" y1="114" x2="158" y2="103" stroke="black" stroke-width="4" />
                    <line x1="158" y1="117" x2="166" y2="108" stroke="black" stroke-width="4" />
                </g>

                <line x1="100" y1="230" x2="65" y2="285" stroke="black" stroke-width="4" />
                <line x1="100" y1="230" x2="135" y2="285" stroke="black" stroke-width="4" />

                <g class="olhos-abertos">
                    <circle cx="85" cy="90" r="3" fill="black" />
                    <circle cx="115" cy="90" r="3" fill="black" />
                </g>

                <g class="olhos-piscando" aria-hidden="true">
                    <line x1="80" y1="92" x2="90" y2="92" stroke="black" stroke-width="3" stroke-linecap="round" />
                    <line x1="110" y1="92" x2="120" y2="92" stroke="black" stroke-width="3" stroke-linecap="round" />
                </g>
                <path d="M 85 110 Q 100 128 115 110" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" />
            </svg>

            <label class="nome-boneco">
                <span>Nome do boneco</span>
                <input id="nome-boneco" type="text" maxlength="20" placeholder="Digite um nome" autocomplete="off">
            </label>

        </div>

        <div class="terceira-linha">
            <a class="opcao profissional" href="profissional.html">Profissional</a>

        </div>

    </main>

    <div id="contato">
        <h2>Cadastro</h2>

        <p id="mensagem-contato" role="status" aria-live="polite"></p>

        <form>
            <div>
                <label for="nome">Nome Completo:</label>
                <input id="nome" type="text" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input id="email" type="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div>
                <label for="sugestao">Sua sugestão:</label>
                <textarea id="sugestao" name="sugestao" placeholder="Digite sua sugestão" rows="5"></textarea>
            </div>

            <fieldset class="opcoes">
                <legend>Como você conheceu nosso app?</legend>
                <label>
                    <input type="radio" name="origem" value="amigos">
                    Indicação de amigos
                </label>
                <label>
                    <input type="radio" name="origem" value="redes">
                    Redes sociais
                </label>
                <label>
                    <input type="checkbox" name="selecao" value="novidades">
                    Quero receber as novidades
                </label>
                <label>
                    <input type="checkbox" name="selecao" value="aceito">
                    Aceito os termos de uso
                </label>
            </fieldset>

            <button type="submit">Enviar Cadastro</button>
        </form>
    </div>

    <script>

        const bonequinho = document.getElementById("bonequinho");
        const mao = document.getElementById("mao-acenando");
        const campoNome = document.getElementById("nome-boneco");
        let piscadaTimer;

        // Guarda o nome do boneco no navegador.
        campoNome.value = localStorage.getItem("nomeBoneco") || "";
        campoNome.addEventListener("input", () => {
            localStorage.setItem("nomeBoneco", campoNome.value);
        });

        // Faz o bonequinho acenar e piscar ao ser clicado.
        function acenar(event) {
            if (event.type === "keydown" && event.key !== "Enter" && event.key !== " ") {
                return;
            }

            event.preventDefault();
            clearTimeout(piscadaTimer);
            bonequinho.classList.add("piscando");
            mao.classList.remove("acenando");
            void mao.getBoundingClientRect();
            mao.classList.add("acenando");
            piscadaTimer = setTimeout(() => {
                bonequinho.classList.remove("piscando");
            }, 2000);
        }

        bonequinho.addEventListener("pointerdown", acenar);
        bonequinho.addEventListener("keydown", acenar);

        mao.addEventListener("animationend", () => {
            mao.classList.remove("acenando");
        });
    </script>

</body>

</html>
